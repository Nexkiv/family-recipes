<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 244 244">
  <defs>
    <!-- soft teardrop leaf, base at origin, pointing +x -->
    <path id="leaf" d="M0 0 C6 -9 22 -13 34 -8 C40 -5 42 -1 40 1 C34 5 18 8 0 0Z"/>
    <!-- acanthus leaf: rounded scallops along the upper edge, rolled tip -->
    <path id="acanthus" d="M0 0 C3 -7 10 -11 16 -10 C18 -15 25 -16 28 -12 C31 -16 38 -15 40 -10 C44 -9 47 -5 45 -1 C43 2 39 1 39 -2 C33 3 15 6 0 0Z"/>
    <g id="arm">
      <!-- main stem along the top edge -->
      <path d="M30 64 C30 36 46 22 72 20 C110 17 150 20 190 17" fill="none" stroke-width="3.2"/>
      <path d="M150 19.5 C165 18.5 178 18 192 17" fill="none" stroke-width="2"/>
      <!-- swept end leaf -->
      <path d="M186 17 C198 4 220 -1 239 7 C231 14 214 22 196 21 C191 21 188 19.5 186 17Z" stroke="none"/>
      <path d="M190 17 C204 12 220 8 234 8" fill="none" stroke="#fff" stroke-width="0.9" opacity="0.6"/>
      <!-- frond curling under the stem, ending in a bud -->
      <path d="M100 21 C110 36 103 52 90 50 C79 48 79 34 89 34 C95 34 98 40 94 43" fill="none" stroke-width="2.4"/>
      <circle cx="93.5" cy="43.5" r="2.4" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(107 33) rotate(70) scale(0.55)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(98 49) rotate(130) scale(0.5)" stroke="none"/>
      <!-- smaller frond further out -->
      <path d="M152 19 C158 30 153 40 145 39 C138 38 138 30 144 30 C147 30 149 33 147 35" fill="none" stroke-width="1.8"/>
      <circle cx="146.6" cy="35.4" r="1.9" stroke="none"/>
      <!-- leaves on the stem -->
      <use href="#leaf" xlink:href="#leaf" transform="translate(80 20) rotate(-24) scale(0.6)" stroke="none"/>
      <use href="#acanthus" xlink:href="#acanthus" transform="translate(120 21) rotate(24) scale(0.72)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(128 19) rotate(-20) scale(0.55)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(164 19.5) rotate(24) scale(0.5)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(170 18) rotate(-18) scale(0.45)" stroke="none"/>
      <!-- small wheat sprig under the end leaf -->
      <path d="M176 22 C181 28 186 32 192 35" fill="none" stroke-width="1.2"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(180 27) rotate(-5) scale(0.28)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(180 27) rotate(80) scale(0.28)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(185 31) rotate(0) scale(0.25)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(185 31) rotate(85) scale(0.25)" stroke="none"/>
      <use href="#leaf" xlink:href="#leaf" transform="translate(191 34.5) rotate(35) scale(0.3)" stroke="none"/>
    </g>
  </defs>
  <g fill="#B48E67" stroke="#B48E67" stroke-linecap="round">
    <use href="#arm" xlink:href="#arm"/>
    <use href="#arm" xlink:href="#arm" transform="matrix(0 1 1 0 0 0)"/>
    <!-- corner: a rolled volute and one broad leaf pointing into the page -->
    <path d="M30 64 C30 76 44 80 50 70 C55 61 46 55 41 60" fill="none" stroke-width="2.6"/>
    <path d="M64 30 C76 30 80 44 70 50 C61 55 55 46 60 41" fill="none" stroke-width="2.6"/>
    <circle cx="41.5" cy="59.5" r="2.4" stroke="none"/>
    <circle cx="59.5" cy="41.5" r="2.4" stroke="none"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(42 42) rotate(45) scale(1.05)" stroke="none"/>
  </g>
</svg>
